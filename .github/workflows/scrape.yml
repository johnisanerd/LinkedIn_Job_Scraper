name: Daily Job Scrape

on:
  schedule:
    - cron: '0 16 * * *'  # noon EDT (UTC-4)
  workflow_dispatch:        # lets you run it manually too

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r Job-O-Clock-main/requirements.txt

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python Job-O-Clock-main/execution/scrape_linkedin_jobs.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: jobs-${{ github.run_id }}
          path: .tmp/jobs_*.csv
